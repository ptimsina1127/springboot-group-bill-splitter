name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Deploy via SSH
        shell: bash
        run: |
          set -e
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          tar czf - -C frontend/dist . | \
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "set -e
             mkdir -p /tmp/frontend-deploy
             tar xzf - -C /tmp/frontend-deploy
             sudo docker cp /tmp/frontend-deploy/. bill-splitter-frontend:/usr/share/nginx/html/
             sudo docker exec bill-splitter-frontend nginx -s reload 2>/dev/null || sudo docker restart bill-splitter-frontend
             rm -rf /tmp/frontend-deploy"
          rm -f /tmp/ssh_key
