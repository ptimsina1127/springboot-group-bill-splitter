name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full nuke & redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/springboot-group-bill-splitter

            echo "=== Backup DB ==="
            mkdir -p ~/db-backups
            sudo docker exec bill-splitter-db sh -c 'exec mysqldump --no-tablespaces -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' 2>/dev/null > ~/db-backups/pre-nuke-$(date +%Y%m%d_%H%M%S).sql || echo "DB backup skipped"

            echo "=== Git pull ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Full nuke ==="
            sudo docker compose down -v 2>/dev/null || true
            sudo docker system prune -a -f 2>/dev/null || true

            echo "=== Rebuild ==="
            sudo docker compose build --no-cache

            echo "=== Start ==="
            sudo docker compose up -d

            echo "=== Verify ==="
            sudo docker compose ps

            echo "=== SSL ==="
            if ! command -v certbot &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq certbot python3-certbot-nginx
            fi
            sudo certbot --nginx \
              -d groupbillsplit.me -d www.groupbillsplit.me \
              --non-interactive --agree-tos --email pravatktimsina@gmail.com \
              --force-renewal || true

            if [ -d /etc/nginx/sites-enabled ]; then
              printf '%s\n' \
                'server {' \
                '    listen 80;' \
                '    server_name groupbillsplit.me www.groupbillsplit.me;' \
                '    return 301 https://$host$request_uri;' \
                '}' \
                'server {' \
                '    listen 443 ssl http2;' \
                '    server_name groupbillsplit.me www.groupbillsplit.me;' \
                '    ssl_certificate /etc/letsencrypt/live/groupbillsplit.me/fullchain.pem;' \
                '    ssl_certificate_key /etc/letsencrypt/live/groupbillsplit.me/privkey.pem;' \
                '    ssl_protocols TLSv1.2 TLSv1.3;' \
                '    ssl_ciphers HIGH:!aNULL:!MD5;' \
                '    location / {' \
                '        proxy_pass https://127.0.0.1:3443;' \
                '        proxy_ssl_verify off;' \
                '        proxy_set_header Host groupbillsplit.me;' \
                '        proxy_set_header X-Real-IP $remote_addr;' \
                '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
                '        proxy_set_header X-Forwarded-Proto https;' \
                '    }' \
                '}' \
                | sudo tee /etc/nginx/sites-enabled/groupbillsplit > /dev/null
            fi
            sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null || true

            sudo docker image prune -f || true
