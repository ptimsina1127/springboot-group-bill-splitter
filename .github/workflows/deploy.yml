name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" bash -c '
            set -e
            cd /home/ubuntu/springboot-group-bill-splitter
            echo "=== Git pull ==="
            git remote prune origin 2>&1 || true
            git fetch origin 2>&1 || true
            git reset --hard origin/main 2>&1 || true
            echo "=== Stop old containers ==="
            sudo docker compose down --remove-orphans 2>&1 || true
            echo "=== Build & start ==="
            sudo docker compose build --no-cache 2>&1 || true
            sudo docker compose up -d 2>&1 || true
            sleep 5
            sudo docker compose ps
          '

      - name: SSL renewal
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" bash -c '
            set -e
            echo "=== SSL renewal ==="
            if command -v certbot &> /dev/null; then
              sudo certbot renew --nginx --non-interactive || true
            fi
            sudo docker image prune -f || true
          '
