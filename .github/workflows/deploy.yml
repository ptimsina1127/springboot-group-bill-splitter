name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 1200s
          script: |
            cd /home/ubuntu/springboot-group-bill-splitter

            echo "=== Git pull ==="
            git remote prune origin 2>&1 || true
            git fetch origin 2>&1 || true
            git reset --hard origin/main 2>&1 || true

            echo "=== Stop old containers ==="
            sudo docker compose down --remove-orphans 2>&1 || true

            echo "=== Build & start ==="
            sudo docker compose build --no-cache 2>&1 || true
            sudo docker compose up -d 2>&1 || true

            sleep 5
            sudo docker compose ps

      - name: SSL & nginx config
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Host nginx ==="
            if [ -d /etc/nginx/sites-enabled ]; then
              printf '%s\n' \
                'server {' \
                '    listen 80;' \
                '    server_name groupbillsplit.me www.groupbillsplit.me;' \
                '    return 301 https://$host$request_uri;' \
                '}' \
                'server {' \
                '    listen 443 ssl http2;' \
                '    server_name groupbillsplit.me www.groupbillsplit.me;' \
                '    ssl_certificate /etc/letsencrypt/live/groupbillsplit.me/fullchain.pem;' \
                '    ssl_certificate_key /etc/letsencrypt/live/groupbillsplit.me/privkey.pem;' \
                '    ssl_protocols TLSv1.2 TLSv1.3;' \
                '    ssl_ciphers HIGH:!aNULL:!MD5;' \
                '    location / {' \
                '        proxy_pass https://127.0.0.1:3443;' \
                '        proxy_ssl_verify off;' \
                '        proxy_set_header Host groupbillsplit.me;' \
                '        proxy_set_header X-Real-IP $remote_addr;' \
                '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
                '        proxy_set_header X-Forwarded-Proto https;' \
                '    }' \
                '}' \
                | sudo tee /etc/nginx/sites-enabled/groupbillsplit > /dev/null
            fi
            sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null || true

            echo "=== SSL ==="
            if ! command -v certbot &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq certbot python3-certbot-nginx
            fi
            sudo certbot --nginx \
              -d groupbillsplit.me -d www.groupbillsplit.me \
              --non-interactive --agree-tos --email pravatktimsina@gmail.com \
              --force-renewal || true

            sudo docker image prune -f || true
