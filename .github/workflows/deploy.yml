name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ubuntu/springboot-group-bill-splitter
            git pull

            sudo docker compose build
            sudo docker compose up -d

            if ! command -v certbot &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq certbot python3-certbot-nginx
            fi
            sudo certbot --nginx \
              -d khoipaisa.duckdns.org -d www.khoipaisa.duckdns.org \
              --non-interactive --agree-tos --email pravatktimsina@gmail.com \
              --force-renewal || true

            if ! crontab -l 2>/dev/null | grep -q "certbot renew"; then
              (crontab -l 2>/dev/null; echo "0 3 1 * * sudo certbot renew --nginx --non-interactive --agree-tos") | crontab -
            fi

            for conf_dir in /etc/nginx/conf.d /etc/nginx/sites-enabled; do
              if [ -d "$conf_dir" ]; then
                printf '%s\n' \
                  'server {' \
                  '    listen 80;' \
                  '    server_name www.khoipaisa.duckdns.org;' \
                  '    return 301 https://khoipaisa.duckdns.org$request_uri;' \
                  '}' \
                  'server {' \
                  '    listen 443 ssl;' \
                  '    server_name www.khoipaisa.duckdns.org;' \
                  '    ssl_certificate /etc/letsencrypt/live/khoipaisa.duckdns.org/fullchain.pem;' \
                  '    ssl_certificate_key /etc/letsencrypt/live/khoipaisa.duckdns.org/privkey.pem;' \
                  '    return 301 https://khoipaisa.duckdns.org$request_uri;' \
                  '}' \
                  | sudo tee "$conf_dir/www-redirect.conf" > /dev/null
              fi
            done
            sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null || sudo systemctl restart nginx 2>/dev/null || true

            sudo docker image prune -f