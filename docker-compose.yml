services:
  db:
    image: mysql:8.0
    container_name: bill-splitter-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    env_file: .env
    mem_limit: 192m
    command: >
      --innodb-buffer-pool-size=32M
      --innodb-log-buffer-size=1M
      --performance-schema=OFF
      --max-connections=10
      --table-open-cache=100
      --thread-cache-size=4
      --tmp-table-size=16M
      --max-heap-table-size=16M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bill-splitter-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    mem_limit: 192m
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /spring-api
    container_name: bill-splitter-frontend
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "3000:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  mysql-data:
